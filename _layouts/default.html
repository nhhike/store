<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% if page.url == "/" or page.url == "/index" or page.url == "/index.html" %}
    <div class="cursor-dot" data-cursor-dot style="opacity: 0;"></div>
    <div class="cursor-outline" data-cursor-outline style="opacity: 0;">
        <div class="compass-n">N</div>
        <div class="compass-s">S</div>
        <div class="compass-e">E</div>
        <div class="compass-w">W</div>
    </div>
    {% endif %}

    <nav class="glass-nav">
        <div class="nav-branding">
            <a href="{{ '/' | relative_url }}" class="nav-logo">
                <img src="{{ '/assets/images/Logo.png' | relative_url }}" alt="NH-HIKE Logo">
            </a>
            <a href="{{ '/' | relative_url }}" class="nav-home">Home</a>
        </div>
        <div class="nav-links">
            <a href="{{ '/trails.html' | relative_url }}">Trails</a>
            <a href="{{ '/gear.html' | relative_url }}">Gear</a>
            <a href="{{ '/app-development.html' | relative_url }}">Downloads</a>
            <a href="{{ '/about.html' | relative_url }}">About</a>
            <a href="{{ '/privacy-policy.html' | relative_url }}">Privacy Policy</a>
        </div>
        <a href="{{ '/join.html' | relative_url }}" class="btn">Join Adventure</a>
    </nav>

    {{ content }}

    {% if page.url == "/" or page.url == "/index" or page.url == "/index.html" %}

    <script>
        const cursorDot = document.querySelector("[data-cursor-dot]");
        const cursorOutline = document.querySelector("[data-cursor-outline]");

        window.addEventListener("mousemove", function (e) {
            cursorDot.style.opacity = "1";
            cursorOutline.style.opacity = "1";

            const posX = e.clientX;
            const posY = e.clientY;
            const screenWidth = window.innerWidth;
            
            const rotation = ((posX - screenWidth / 2) / (screenWidth / 2)) * -90;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;
            cursorDot.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;

            cursorOutline.style.left = `${posX}px`;
            cursorOutline.style.top = `${posY}px`;
            cursorOutline.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
        });
    </script>
    {% endif %}
</body>
</html>
