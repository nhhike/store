<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="cursor-dot" data-cursor-dot></div>
    <div class="cursor-outline" data-cursor-outline></div>

    <div class="logo-top-center">
        <a href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/images/Logo.png' | relative_url }}" alt="NH-Hike Logo">
        </a>
    </div>

    <nav class="glass-nav">
        <div class="nav-links">
            <a href="{{ '/trails.html' | relative_url }}">Trails</a>
            <a href="{{ '/gear.html' | relative_url }}">Gear</a>
            <a href="{{ '/about.html' | relative_url }}">About</a>
        </div>
        <a href="{{ '/join.html' | relative_url }}" class="btn">Join Adventure</a>
    </nav>

    {{ content }}

    <script>
        const cursorDot = document.querySelector("[data-cursor-dot]");
        const cursorOutline = document.querySelector("[data-cursor-outline]");

        window.addEventListener("mousemove", function (e) {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });
    </script>
</body>
</html>
