---
layout: default
title: Gallery
---

<!-- 
    DYNAMIC GALLERY SYSTEM
    This implementation is 100% client-side and dynamic. 
    It fetches live data from Google Drive.
-->

<section class="hero" style="min-height: 200px; padding-top: 120px;">
    <div class="hero-content">
        <h1>Gallery</h1>
        <p>Explore the beauty of New Hampshire through our lens.</p>
    </div>
</section>

<div class="main-content" style="max-width: 1200px; margin: 0 auto; padding: 0 20px 50px;">
    <!-- Gallery Picker -->
    <div class="glass-content" style="margin-bottom: 30px; text-align: center;">
        <h3 style="color: var(--accent); margin-bottom: 20px;">Select a Collection</h3>
        <select id="gallery-picker"
            style="background: #1e293b; color: #fff; border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 30px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; width: min(100%, 400px); appearance: auto;">
            <option value="" disabled selected style="background: #1e293b; color: #fff;">-- Select a Gallery --</option>
        </select>
        <div id="api-notice" style="display: none; margin-top: 15px; font-size: 0.8rem; color: var(--accent);">
            <i class="fa-solid fa-triangle-exclamation"></i> API Key required for live updates.
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #fff;">Get one
                here</a>.
        </div>
    </div>

    <!-- Description Area -->
    <div id="gallery-description" class="glass-content" style="margin-bottom: 30px; display: none;">
        <!-- Markdown content rendered here -->
    </div>

    <!-- Gallery Items Grid -->
    <div id="gallery-grid" class="card-grid"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 0;">
        <!-- Dynamic content -->
    </div>

    <!-- Media Modal -->
    <div id="media-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <span id="close-modal"
            style="position: absolute; top: 30px; right: 40px; color: #fff; font-size: 40px; cursor: pointer; z-index: 2001;">&times;</span>
        
        <!-- Navigation Arrows -->
        <div id="prev-media" style="position: absolute; left: 30px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 50px; cursor: pointer; z-index: 2001; opacity: 0.7; transition: 0.3s; padding: 20px;">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        <div id="next-media" style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 50px; cursor: pointer; z-index: 2001; opacity: 0.7; transition: 0.3s; padding: 20px;">
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div id="modal-content"
            style="max-width: 85%; max-height: 85%; display: flex; align-items: center; justify-content: center;"></div>
        <div id="modal-caption"
            style="position: absolute; bottom: 30px; color: #fff; font-family: 'Inter', sans-serif; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;">
        </div>
    </div>
</div>

<!-- Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const API_KEY = 'AIzaSyB4KXMciiR9YisJ_1M2C5-EiiyeFJPWSlw'; 
    const ROOT_ID = '1EfIJvPEiJp48qs55RYypFcFHTJHGjqCX';

    let currentMediaList = [];
    let currentIndex = 0;

    const picker = document.getElementById('gallery-picker');
    const grid = document.getElementById('gallery-grid');
    const descArea = document.getElementById('gallery-description');
    const modal = document.getElementById('media-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCaption = document.getElementById('modal-caption');
    const closeModal = document.getElementById('close-modal');
    const prevBtn = document.getElementById('prev-media');
    const nextBtn = document.getElementById('next-media');

    document.addEventListener('DOMContentLoaded', () => {
        if (!API_KEY) {
            document.getElementById('api-notice').style.display = 'block';
            picker.innerHTML = '<option value="" disabled selected>API Key missing in gallery.html</option>';
            return;
        }
        initGallery();
    });

    async function initGallery() {
        try {
            const url = `https://www.googleapis.com/drive/v3/files?q='${ROOT_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) {
                console.error('Gallery API Error:', data.error);
                throw new Error(data.error.message);
            }

            const folders = data.files.filter(f => 
                f.mimeType === 'application/vnd.google-apps.folder' || 
                f.mimeType === 'application/vnd.google-apps.shortcut'
            );

            if (folders.length === 0) {
                picker.innerHTML = '<option value="" disabled selected style="background: #1e293b; color: #fff;">No subfolders found in root.</option>';
                return;
            }

            picker.innerHTML = '<option value="" disabled selected style="background: #1e293b; color: #fff;">-- Select a Gallery --</option>';
            folders.sort((a, b) => a.name.localeCompare(b.name)).forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                option.style.background = '#1e293b';
                option.style.color = '#fff';
                picker.appendChild(option);
            });

            picker.addEventListener('change', (e) => loadFolder(e.target.value));

        } catch (err) {
            console.error('Drive Init Error:', err);
            picker.innerHTML = `<option disabled selected>Error: ${err.message}</option>`;
            if (err.message.includes('blocked') || err.message.includes('restricted')) {
                document.getElementById('api-notice').style.display = 'block';
            }
        }
    }

    async function loadFolder(folderId) {
        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Loading assets...</div>';
        descArea.style.display = 'none';
        currentMediaList = [];
        
        try {
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,webContentLink)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            const files = data.files;
            
            const mdFile = files.find(f => f.name.endsWith('.md'));
            if (mdFile) {
                const contentUrl = `https://www.googleapis.com/drive/v3/files/${mdFile.id}?alt=media&key=${API_KEY}`;
                const mdResponse = await fetch(contentUrl);
                const mdText = await mdResponse.text();
                descArea.innerHTML = marked.parse(mdText);
                descArea.style.display = 'block';
            }

            currentMediaList = files.filter(f => f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/'))
                                  .sort((a, b) => a.name.localeCompare(b.name));
            
            grid.innerHTML = '';
            if (currentMediaList.length === 0) {
                grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1/-1;">No media found in this folder.</p>';
                return;
            }

            currentMediaList.forEach((file, index) => {
                renderMediaCard(file, index);
            });

        } catch (err) {
            grid.innerHTML = `<p style="color: red;">Error loading folder: ${err.message}</p>`;
        }
    }

    function renderMediaCard(file, index) {
        const isVideo = file.mimeType.startsWith('video/');
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.padding = '0';
        card.style.overflow = 'hidden';
        card.style.cursor = 'pointer';

        const thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=s400`;

        card.innerHTML = `
            <div style="position: relative; width: 100%; aspect-ratio: 1/1; background: rgba(0,0,0,0.1);">
                <img src="${thumbUrl}" alt="${file.name}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.5s;">
                ${isVideo ? '<i class="fa-solid fa-play" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.5rem; opacity: 0.8;"></i>' : ''}
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: rgba(0,0,0,0.5); opacity: 0; transition: 0.3s;" class="card-label">
                    <span style="font-size: 0.7rem; color: #fff;">${file.name}</span>
                </div>
            </div>
        `;

        card.addEventListener('mouseenter', () => { 
            card.querySelector('img').style.transform = 'scale(1.1)'; 
            card.querySelector('.card-label').style.opacity = '1';
        });
        card.addEventListener('mouseleave', () => { 
            card.querySelector('img').style.transform = 'scale(1)'; 
            card.querySelector('.card-label').style.opacity = '0';
        });

        card.addEventListener('click', () => {
            currentIndex = index;
            openMedia(file);
        });
        grid.appendChild(card);
    }

    function openMedia(file) {
        modalContent.innerHTML = '';
        modalCaption.textContent = file.name;
        
        if (file.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.borderRadius = '8px';
            modalContent.appendChild(img);
        } else if (file.mimeType.startsWith('video/')) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${file.id}/preview`;
            iframe.width = '800';
            iframe.height = '450';
            iframe.style.border = 'none';
            iframe.setAttribute('allow', 'autoplay');
            modalContent.appendChild(iframe);
        }

        modal.style.display = 'flex';
    }

    function showPrev() {
        currentIndex = (currentIndex - 1 + currentMediaList.length) % currentMediaList.length;
        openMedia(currentMediaList[currentIndex]);
    }

    function showNext() {
        currentIndex = (currentIndex + 1) % currentMediaList.length;
        openMedia(currentMediaList[currentIndex]);
    }

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });

    prevBtn.addEventListener('mouseenter', () => { prevBtn.style.opacity = '1'; });
    prevBtn.addEventListener('mouseleave', () => { prevBtn.style.opacity = '0.7'; });
    nextBtn.addEventListener('mouseenter', () => { nextBtn.style.opacity = '1'; });
    nextBtn.addEventListener('mouseleave', () => { nextBtn.style.opacity = '0.7'; });

    closeModal.addEventListener('click', () => {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
    });

    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            modalContent.innerHTML = '';
        }
    });

    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') {
                modal.style.display = 'none';
                modalContent.innerHTML = '';
            } else if (e.key === 'ArrowLeft') {
                showPrev();
            } else if (e.key === 'ArrowRight') {
                showNext();
            }
        }
    });
</script>
