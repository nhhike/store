---
layout: default
title: Gallery
---

<!-- 
    DYNAMIC GALLERY SYSTEM
    This implementation is 100% client-side and dynamic. 
    It fetches live data from Google Drive.
-->

<section class="hero" style="min-height: 200px; padding-top: 120px;">
    <div class="hero-content">
        <h1>Gallery</h1>
        <p>Explore the beauty of New Hampshire through our lens.</p>
    </div>
</section>

<div class="main-content" style="max-width: 1200px; margin: 0 auto; padding: 0 20px 50px;">
    <!-- Gallery Picker -->
    <div class="glass-content" style="margin-bottom: 30px; text-align: center;">
        <h3 style="color: var(--accent); margin-bottom: 20px;">Select a Collection</h3>
        <select id="gallery-picker" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 30px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; width: min(100%, 400px);">
            <option value="" disabled selected>Connecting to Drive...</option>
        </select>
        <div id="api-notice" style="display: none; margin-top: 15px; font-size: 0.8rem; color: var(--accent);">
            <i class="fa-solid fa-triangle-exclamation"></i> API Key required for live updates. 
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #fff;">Get one here</a>.
        </div>
    </div>

    <!-- Description Area -->
    <div id="gallery-description" class="glass-content" style="margin-bottom: 30px; display: none;">
        <!-- Markdown content rendered here -->
    </div>

    <!-- Gallery Items Grid -->
    <div id="gallery-grid" class="card-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0;">
        <!-- Dynamic content -->
    </div>

    <!-- Media Modal -->
    <div id="media-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <span id="close-modal" style="position: absolute; top: 30px; right: 40px; color: #fff; font-size: 40px; cursor: pointer;">&times;</span>
        <div id="modal-content" style="max-width: 90%; max-height: 90%; display: flex; align-items: center; justify-content: center;"></div>
        <div id="modal-caption" style="position: absolute; bottom: 30px; color: #fff; font-family: 'Inter', sans-serif; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;"></div>
    </div>
</div>

<!-- Marked.js for Markdown parsing if .md files are found -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    /**
     * CONFIGURATION
     * Replace API_KEY with your Google Cloud API Key.
     * Ensure the Drive API is enabled and the root folder is shared as 'Public' or 'Anyone with link'.
     */
    const API_KEY = ''; // ADD YOUR API KEY HERE
    const ROOT_ID = '1EfIJvPEiJp48qs55RYypFcFHTJHGjqCX';

    const picker = document.getElementById('gallery-picker');
    const grid = document.getElementById('gallery-grid');
    const descArea = document.getElementById('gallery-description');
    const modal = document.getElementById('media-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCaption = document.getElementById('modal-caption');
    const closeModal = document.getElementById('close-modal');

    document.addEventListener('DOMContentLoaded', () => {
        if (!API_KEY) {
            document.getElementById('api-notice').style.display = 'block';
            picker.innerHTML = '<option value="" disabled selected>API Key missing in gallery.html</option>';
            return;
        }
        initGallery();
    });

    async function initGallery() {
        try {
            const url = `https://www.googleapis.com/drive/v3/files?q='${ROOT_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&fields=files(id,name)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            picker.innerHTML = '<option value="" disabled selected>-- Select a Gallery --</option>';
            data.files.sort((a, b) => a.name.localeCompare(b.name)).forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                picker.appendChild(option);
            });

            picker.addEventListener('change', (e) => loadFolder(e.target.value));

        } catch (err) {
            console.error('Drive Error:', err);
            picker.innerHTML = `<option disabled selected>Error: ${err.message}</option>`;
        }
    }

    async function loadFolder(folderId) {
        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Loading assets...</div>';
        descArea.style.display = 'none';
        
        try {
            // Fetch all files in the folder (images, videos, and potential .md)
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,webContentLink)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            const files = data.files;
            
            // 1. Handle Markdown Description
            const mdFile = files.find(f => f.name.endsWith('.md'));
            if (mdFile) {
                const contentUrl = `https://www.googleapis.com/drive/v3/files/${mdFile.id}?alt=media&key=${API_KEY}`;
                const mdResponse = await fetch(contentUrl);
                const mdText = await mdResponse.text();
                descArea.innerHTML = marked.parse(mdText);
                descArea.style.display = 'block';
            }

            // 2. Filter images and videos
            const media = files.filter(f => f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/'));
            
            grid.innerHTML = '';
            if (media.length === 0) {
                grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1/-1;">No media found in this folder.</p>';
                return;
            }

            media.sort((a, b) => a.name.localeCompare(b.name)).forEach(file => {
                renderMediaCard(file);
            });

        } catch (err) {
            grid.innerHTML = `<p style="color: red;">Error loading folder: ${err.message}</p>`;
        }
    }

    function renderMediaCard(file) {
        const isVideo = file.mimeType.startsWith('video/');
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.padding = '0';
        card.style.overflow = 'hidden';
        card.style.cursor = 'pointer';

        // Thumbnail link for Drive images/videos
        const thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=s400`;

        card.innerHTML = `
            <div style="position: relative; width: 100%; aspect-ratio: 1/1; background: rgba(0,0,0,0.2);">
                <img src="${thumbUrl}" alt="${file.name}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.5s;">
                ${isVideo ? '<i class="fa-solid fa-play" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 2rem; opacity: 0.8;"></i>' : ''}
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); opacity: 0; transition: 0.3s;" class="card-label">
                    <span style="font-size: 0.75rem; color: #fff;">${file.name}</span>
                </div>
            </div>
        `;

        card.addEventListener('mouseenter', () => { 
            card.querySelector('img').style.transform = 'scale(1.1)'; 
            card.querySelector('.card-label').style.opacity = '1';
        });
        card.addEventListener('mouseleave', () => { 
            card.querySelector('img').style.transform = 'scale(1)'; 
            card.querySelector('.card-label').style.opacity = '0';
        });

        card.addEventListener('click', () => openMedia(file));
        grid.appendChild(card);
    }

    function openMedia(file) {
        modalContent.innerHTML = '';
        modalCaption.textContent = file.name;
        
        if (file.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${file.id}=s0`; // Original size
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.borderRadius = '10px';
            modalContent.appendChild(img);
        } else if (file.mimeType.startsWith('video/')) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${file.id}/preview`;
            iframe.width = '800';
            iframe.height = '450';
            iframe.style.border = 'none';
            iframe.setAttribute('allow', 'autoplay');
            modalContent.appendChild(iframe);
        }

        modal.style.display = 'flex';
    }

    closeModal.addEventListener('click', () => {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
    });

    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            modalContent.innerHTML = '';
        }
    });

    // Handle Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
            modal.style.display = 'none';
            modalContent.innerHTML = '';
        }
    });
</script>
