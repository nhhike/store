<script>
    const API_KEY = 'AIzaSyB4KXMciiR9YisJ_1M2C5-EiiyeFJPWSlw';
    const ROOT_ID = '1EfIJvPEiJp48qs55RYypFcFHTJHGjqCX';

    let currentMediaList = [];
    let currentIndex = 0;
    let showMetadata = false;

    const grid = document.getElementById('gallery-grid');
    const descArea = document.getElementById('gallery-description');
    const modal = document.getElementById('media-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCaption = document.getElementById('modal-caption');
    const metaOverlay = document.getElementById('metadata-overlay');
    const metaToggle = document.getElementById('metadata-toggle');
    const closeModal = document.getElementById('close-modal');
    const prevBtn = document.getElementById('prev-media');
    const nextBtn = document.getElementById('next-media');
    const jumpToImages = document.getElementById('jump-to-images');
    const backToTop = document.getElementById('back-to-top');
    const tabsHeader = document.getElementById('tabs-header');
    const tabsContent = document.getElementById('tabs-content');

    document.addEventListener('DOMContentLoaded', () => {
        if (!API_KEY) {
            document.getElementById('api-notice').style.display = 'block';
            document.getElementById('selected-label').textContent = 'API Key missing';
            return;
        }
        initGallery();
    });

    async function initGallery() {
        try {
            const dropdown = document.getElementById('picker-dropdown');
            const trigger = document.getElementById('picker-trigger');
            const label = document.getElementById('selected-label');

            // Load Dynamic Groups
            let groupNames = [];
            try {
                const gResp = await fetch('assets/galleryGroups.txt');
                const gText = await gResp.text();
                groupNames = gText.split('\n')
                    .map(g => g.trim())
                    .filter(g => g && g.toLowerCase() !== 'other');
            } catch (e) {
                console.warn('Gallery groups file not found or failed to load');
            }

            const url = `https://www.googleapis.com/drive/v3/files?q='${ROOT_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            const folders = data.files.filter(f =>
                f.mimeType === 'application/vnd.google-apps.folder' ||
                f.mimeType === 'application/vnd.google-apps.shortcut'
            );

            // Group and Sort Folders
            const groups = {};
            folders.forEach(f => {
                const name = f.name;
                const match = name.match(/^(\d{4})\s+(.*)/);
                const year = match ? parseInt(match[1]) : 0;

                let assignedGroup = "Other";
                for (const gName of groupNames) {
                    if (name.toLowerCase().includes(gName.toLowerCase())) {
                        assignedGroup = gName;
                        break;
                    }
                }

                if (!groups[assignedGroup]) groups[assignedGroup] = [];
                groups[assignedGroup].push({ id: f.id, name, year });
            });

            dropdown.innerHTML = '';

            const renderGroup = (groupLabel, items) => {
                if (!items || items.length === 0) return;

                const header = document.createElement('div');
                header.className = 'picker-group-label';
                header.textContent = groupLabel;
                dropdown.appendChild(header);

                items.sort((a, b) => (b.year - a.year) || a.name.localeCompare(b.name)).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'picker-item';
                    div.textContent = item.name;
                    div.onclick = () => {
                        label.textContent = item.name;
                        dropdown.classList.remove('show');
                        trigger.classList.remove('active');
                        loadFolder(item.id);
                    };
                    dropdown.appendChild(div);
                });
            };

            // Render groups
            groupNames.forEach(g => renderGroup(g, groups[g]));
            renderGroup("Other", groups["Other"]);

            // Toggle logic
            trigger.onclick = (e) => {
                e.stopPropagation();
                trigger.classList.toggle('active');
                dropdown.classList.toggle('show');
            };

            // Close outside
            window.addEventListener('click', () => {
                dropdown.classList.remove('show');
                trigger.classList.remove('active');
            });

        } catch (err) {
            console.error('Gallery init failed:', err);
            const trigger = document.getElementById('picker-trigger');
            if (trigger) trigger.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
        }
    }

    async function loadFolder(folderId) {
        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Loading assets...</div>';
        descArea.style.display = 'none';
        currentMediaList = [];

        try {
            // Include imageMediaMetadata and videoMediaMetadata in request
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,webContentLink,imageMediaMetadata,videoMediaMetadata)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            const files = data.files;
            const textFiles = prepareTabData(files.filter(f => f.name.endsWith('.md')));
            const mapFiles = prepareTabData(files.filter(f => f.name.endsWith('.gpx') || f.name.endsWith('.kml')));

            if (textFiles.length > 0 || mapFiles.length > 0) {
                const textRow = document.getElementById('text-tabs-row');
                const mapRow = document.getElementById('map-tabs-row');
                const midDiv = document.getElementById('tabs-middle-divider');

                textRow.innerHTML = '';
                mapRow.innerHTML = '';
                midDiv.style.display = (textFiles.length > 0 && mapFiles.length > 0) ? 'block' : 'none';

                tabsContent.innerHTML = '';
                descArea.style.display = 'block';

                let tabIdx = 0;

                // Render Text Tabs
                textFiles.forEach((file) => {
                    createTabElements(file, tabIdx++, tabIdx === 1, textRow);
                });

                // Render Map Tabs
                mapFiles.forEach((file) => {
                    createTabElements(file, tabIdx++, tabIdx === 1, mapRow);
                });
            }

            currentMediaList = files.filter(f => f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/'))
                .sort((a, b) => a.name.localeCompare(b.name));

            grid.innerHTML = '';
            currentMediaList.forEach((file, index) => renderMediaCard(file, index));

        } catch (err) {
            console.error('Folder load error:', err);
            grid.innerHTML = `<p style="color: red;">Error loading folder: ${err.message}</p>`;
        }
    }

    function prepareTabData(files) {
        return files.map(file => {
            const name = file.name;
            const match = name.match(/^(\d{1,2})\s*(.*)/);
            const order = match ? parseInt(match[1], 10) : Infinity;
            const remainingName = match ? match[2] : name;
            const cleanName = remainingName.replace(/\.(md|gpx|kml)$/i, '');
            return { ...file, order, cleanName };
        }).sort((a, b) => {
            if (a.order !== b.order) return a.order - b.order;
            return a.name.localeCompare(b.name);
        });
    }

    function createTabElements(file, idx, isFirst, container) {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
        btn.textContent = file.cleanName;
        btn.dataset.tabId = `tab-${idx}`;
        btn.addEventListener('click', () => switchTab(btn, `tab-${idx}`));
        container.appendChild(btn);

        const pane = document.createElement('div');
        pane.id = `tab-${idx}`;
        pane.className = `tab-pane ${isFirst ? 'active' : ''}`;
        tabsContent.appendChild(pane);

        if (file.name.endsWith('.md')) {
            loadMarkdownTab(file, pane);
        } else {
            loadMapTab(file, pane);
        }
    }

    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const pane = document.getElementById(tabId);
        pane.classList.add('active');

        // Ensure "Read More" logic is recalculated if it was missed
        const toggle = pane.querySelector('.desc-toggle-btn');
        const wrapper = pane.querySelector('.collapsible-wrapper');
        const inner = pane.querySelector('.collapsible-inner');
        if (toggle && inner && wrapper && !wrapper.classList.contains('expanded')) {
            if (inner.scrollHeight > 145) toggle.style.display = 'block';
        }

        // If there's a map in this pane, invalidate size to fix rendering issues
        const mapDiv = pane.querySelector('.map-container');
        if (mapDiv && mapDiv._leaflet_map) {
            setTimeout(() => {
                mapDiv._leaflet_map.invalidateSize();
                // If it's the first time or bounds aren't set, try to fit bounds again
                if (mapDiv._leaflet_track) {
                    mapDiv._leaflet_map.fitBounds(mapDiv._leaflet_track.getBounds());
                }
            }, 100);
        }
    }

    async function loadMarkdownTab(file, pane) {
        try {
            const url = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
            const resp = await fetch(url);

            if (!resp.ok) {
                const errData = await resp.json().catch(() => ({ error: { message: resp.statusText } }));
                throw new Error(errData.error?.message || `HTTP ${resp.status}`);
            }

            const text = await resp.text();
            const contentHtml = marked.parse(text);
            initCollapsiblePane(pane, contentHtml);

        } catch (e) {
            console.error('Markdown load error:', e);
            pane.innerHTML = `
                <div style="padding: 20px; text-align: center; color: #ff6b6b; background: rgba(255,0,0,0.05); border-radius: 12px; border: 1px solid rgba(255,107,107,0.2);">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    <p style="font-weight: 600;">Failed to load "${file.name}"</p>
                    <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 5px;">${e.message}</p>
                    <p style="font-size: 0.75rem; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;">
                        Tip: Ensure the file is shared as "Anyone with the link can view" in Google Drive.
                    </p>
                </div>
            `;
        }
    }

    async function loadMapTab(file, pane) {
        const containerId = `map-${file.id}`;

        try {
            const url = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.text();

            const mapHtml = `<div id="${containerId}" class="map-container"></div>`;
            initCollapsiblePane(pane, mapHtml, true); // true = autoExpand for maps

            setTimeout(() => {
                const mapDiv = document.getElementById(containerId);
                if (!mapDiv) return;

                const map = L.map(containerId).setView([43.0, -71.5], 10);
                L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    maxZoom: 17,
                    attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
                }).addTo(map);

                mapDiv._leaflet_map = map;

                const layer = file.name.endsWith('.gpx')
                    ? new L.GPX(data, {
                        async: true,
                        marker_options: {
                            startIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-start.png',
                            endIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-end.png',
                            shadowUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-shadow.png'
                        }
                    })
                    : omnivore.kml(data);

                layer.on('loaded', function (e) {
                    map.fitBounds(e.target ? e.target.getBounds() : layer.getBounds());
                    mapDiv._leaflet_track = e.target || layer;
                }).addTo(map);

                if (file.name.endsWith('.kml')) {
                    // Omnivore KML doesn't always fire 'loaded' same way
                    setTimeout(() => map.fitBounds(layer.getBounds()), 1000);
                }

            }, 500);

        } catch (e) {
            console.error('Map load error:', e);
            pane.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff6b6b;">Failed to load Map "${file.name}": ${e.message}</div>`;
        }
    }

    function initCollapsiblePane(pane, innerHtml, autoExpand = false) {
        pane.innerHTML = `
            <div class="collapsible-wrapper">
                <div class="collapsible-inner">${innerHtml}</div>
            </div>
            <button class="desc-toggle-btn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; margin-top: 15px; padding: 5px 0; display: none; font-size: 0.9rem;">
                Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>
            </button>
        `;

        const wrapper = pane.querySelector('.collapsible-wrapper');
        const inner = pane.querySelector('.collapsible-inner');
        const toggle = pane.querySelector('.desc-toggle-btn');

        if (autoExpand) {
            wrapper.classList.add('expanded');
            toggle.style.display = 'none'; // No need for toggle if auto-expanded
        }

        setTimeout(() => {
            if (!autoExpand && inner.scrollHeight > 150) {
                toggle.style.display = 'block';
            }
        }, 800);

        toggle.addEventListener('click', () => {
            const isExpanded = wrapper.classList.contains('expanded');
            if (isExpanded) {
                wrapper.classList.remove('expanded');
                toggle.innerHTML = 'Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>';
            } else {
                wrapper.classList.add('expanded');
                toggle.innerHTML = 'Read Less <i class="fa-solid fa-chevron-up" style="font-size: 0.7rem; margin-left: 5px;"></i>';
            }

            // Fix map if it was just expanded
            const mapDiv = wrapper.querySelector('.map-container');
            if (mapDiv && mapDiv._leaflet_map) {
                setTimeout(() => mapDiv._leaflet_map.invalidateSize(), 500);
            }
        });
    }

    function renderMediaCard(file, index) {
        const isVideo = file.mimeType.startsWith('video/');
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.padding = '0';
        card.style.cursor = 'pointer';
        card.style.overflow = 'hidden';

        card.innerHTML = `
            <div style="position: relative; width: 100%; aspect-ratio: 1/1;">
                <img src="https://lh3.googleusercontent.com/d/${file.id}=s400" alt="${file.name}" style="width:100%; height:100%; object-fit:cover; transition:0.4s;">
                ${isVideo ? '<i class="fa-solid fa-play" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:1.5rem; opacity:0.7;"></i>' : ''}
            </div>
        `;

        card.addEventListener('mouseenter', () => card.querySelector('img').style.transform = 'scale(1.1)');
        card.addEventListener('mouseleave', () => card.querySelector('img').style.transform = 'scale(1)');
        card.addEventListener('click', () => { currentIndex = index; openMedia(file); });
        grid.appendChild(card);
    }

    function openMedia(file) {
        modalContent.innerHTML = '';
        modalCaption.textContent = file.name;

        if (file.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
            img.style.maxWidth = '100%'; img.style.maxHeight = '100%'; img.style.borderRadius = '8px';
            modalContent.appendChild(img);
            renderMetadata(file.imageMediaMetadata);
        } else if (file.mimeType.startsWith('video/')) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${file.id}/preview`;
            iframe.width = '800'; iframe.height = '450'; iframe.style.border = 'none';
            modalContent.appendChild(iframe);
            renderMetadata(file.videoMediaMetadata);
        }

        const wasOpen = modal.style.display === 'flex';
        modal.style.display = 'flex';
        metaOverlay.style.display = showMetadata ? 'block' : 'none';

        // Push state for back button handling ONLY if not already open
        if (!wasOpen) {
            history.pushState({ modalOpen: true }, '');
        }
    }

    function renderMetadata(meta) {
        if (!meta) {
            metaOverlay.innerHTML = '<i class="fa-solid fa-slash"></i> No Metadata Available';
            return;
        }

        let html = '<div style="display: grid; gap: 8px;">';
        if (meta.cameraMake || meta.cameraModel) html += `<div><i class="fa-solid fa-camera"></i> ${meta.cameraMake || ''} ${meta.cameraModel || ''}</div>`;
        if (meta.lens) html += `<div><i class="fa-solid fa-circle-dot"></i> ${meta.lens}</div>`;
        if (meta.focalLength) html += `<div><i class="fa-solid fa-crosshairs"></i> ${meta.focalLength}mm</div>`;
        if (meta.aperture) html += `<div><i class="fa-solid fa-circle-half-stroke"></i> f/${meta.aperture}</div>`;
        if (meta.shutterSpeed) html += `<div><i class="fa-solid fa-clock"></i> ${formatShutter(meta.shutterSpeed)}s</div>`;
        if (meta.isoSpeed) html += `<div><i class="fa-solid fa-film"></i> ISO ${meta.isoSpeed}</div>`;
        if (meta.width && meta.height) html += `<div><i class="fa-solid fa-up-right-and-down-left-from-center"></i> ${meta.width} x ${meta.height}</div>`;
        if (meta.time) html += `<div><i class="fa-solid fa-calendar-day"></i> ${new Date(meta.time).toLocaleDateString()}</div>`;
        html += '</div>';
        metaOverlay.innerHTML = html;
    }

    function formatShutter(speed) {
        if (!speed) return '';
        if (speed < 1) {
            return `1/${Math.round(1 / speed)}`;
        }
        return speed;
    }

    metaToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        showMetadata = !showMetadata;
        metaOverlay.style.display = showMetadata ? 'block' : 'none';
        metaToggle.style.background = showMetadata ? 'var(--accent)' : 'rgba(255,255,255,0.1)';
        metaToggle.style.color = showMetadata ? '#000' : '#fff';
    });

    function showPrev() { currentIndex = (currentIndex - 1 + currentMediaList.length) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }
    function showNext() { currentIndex = (currentIndex + 1) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }

    function closeModalHandler() {
        if (modal.style.display === 'flex') {
            if (history.state && history.state.modalOpen) {
                history.back(); // This will trigger the popstate event below
            } else {
                hideModal();
            }
        }
    }

    function hideModal() {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
    }


    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
    closeModal.addEventListener('click', closeModalHandler);

    window.addEventListener('click', (e) => { if (e.target === modal) closeModalHandler(); });

    window.addEventListener('popstate', (e) => {
        hideModal();
    });

    // Jump to images logic
    jumpToImages.addEventListener('click', () => {
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Back to top logic
    window.addEventListener('scroll', () => {
        if (window.scrollY > 400) {
            backToTop.style.display = 'flex';
        } else {
            backToTop.style.display = 'none';
        }
    });

    backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    backToTop.addEventListener('mouseenter', () => {
        backToTop.style.transform = 'translateY(-5px)';
        backToTop.style.background = '#fff';
    });
    backToTop.addEventListener('mouseleave', () => {
        backToTop.style.transform = 'translateY(0)';
        backToTop.style.background = 'var(--accent)';
    });

    jumpToImages.addEventListener('mouseenter', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.2)';
        jumpToImages.style.borderColor = 'var(--accent)';
    });
    jumpToImages.addEventListener('mouseleave', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.1)';
        jumpToImages.style.borderColor = 'var(--glass-border)';
    });

    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') closeModal.click();
            else if (e.key === 'ArrowLeft') showPrev();
            else if (e.key === 'ArrowRight') showNext();
            else if (e.key.toLowerCase() === 'i') metaToggle.click();
        }
    });
</script>
