---
layout: default
title: Gallery
---

<!-- 
    DYNAMIC GALLERY SYSTEM
    This implementation is 100% client-side and dynamic. 
    It fetches live data from Google Drive.
-->

<!-- Leaflet for GPX Mapping -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<style>
    .tab-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 10px 20px;
        border-radius: 12px 12px 0 0;
        cursor: pointer;
        font-family: 'Outfit', sans-serif;
        font-size: 0.9rem;
        transition: 0.3s;
        border-bottom: none;
        opacity: 0.6;
    }
    .tab-btn.active {
        background: rgba(255,255,255,0.15);
        opacity: 1;
        border-top: 2px solid var(--accent);
    }
    .tab-pane {
        display: none;
        padding-top: 20px;
    }
    .tab-pane.active {
        display: block;
    }
    .markdown-content {
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .markdown-content.expanded {
        display: block;
        -webkit-line-clamp: unset;
    }
    .map-container {
        width: 100%;
        height: 450px;
        border-radius: 15px;
        border: 1px solid var(--glass-border);
        z-index: 10;
    }
</style>

<section class="hero" style="min-height: 200px; padding-top: 120px;">
    <div class="hero-content">
        <h1>Gallery</h1>
        <p>Explore the beauty of New Hampshire through our lens.</p>
    </div>
</section>

<div class="main-content" style="max-width: 1200px; margin: 0 auto; padding: 0 20px 50px;">
    <!-- Gallery Picker -->
    <div class="glass-content" style="margin-bottom: 30px; text-align: center;">
        <h3 style="color: var(--accent); margin-bottom: 20px;">Select a Collection</h3>
        <select id="gallery-picker"
            style="background: #1e293b; color: #fff; border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 30px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; width: min(100%, 400px); appearance: auto;">
            <option value="" disabled selected style="background: #1e293b; color: #fff;">-- Select a Gallery --</option>
        </select>
        <div id="api-notice" style="display: none; margin-top: 15px; font-size: 0.8rem; color: var(--accent);">
            <i class="fa-solid fa-triangle-exclamation"></i> API Key required for live updates.
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #fff;">Get one
                here</a>.
        </div>
    </div>

    <!-- Description Area -->
    <div id="gallery-description" class="glass-content" style="margin-bottom: 30px; display: none; position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;">
            <div id="tabs-header" style="display: flex; gap: 5px; flex-wrap: wrap;">
                <!-- Tab buttons generated here -->
            </div>
            <button id="jump-to-images" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: 0.3s; display: flex; align-items: center; gap: 8px;">
                Jump to Images <i class="fa-solid fa-images"></i>
            </button>
        </div>
        <div id="tabs-content">
            <!-- Tab panes generated here -->
        </div>
    </div>

    <!-- Gallery Items Grid -->
    <div id="gallery-grid" class="card-grid"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 0;">
        <!-- Dynamic content -->
    </div>
    
    <!-- Floating Back to Top Button -->
    <button id="back-to-top" style="position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: var(--accent); color: #000; border: none; border-radius: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s;">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Media Modal -->
    <div id="media-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
        <!-- Close Button -->
        <span id="close-modal"
            style="position: absolute; top: 30px; right: 40px; color: #fff; font-size: 40px; cursor: pointer; z-index: 2005;">&times;</span>
        
        <!-- Metadata Toggle -->
        <div id="metadata-toggle" style="position: absolute; top: 35px; right: 100px; color: #fff; font-size: 1.2rem; cursor: pointer; z-index: 2005; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; transition: 0.3s;">
            <i class="fa-solid fa-circle-info"></i> <span style="font-size: 0.9rem; margin-left: 5px;">Stats</span>
        </div>

        <!-- Navigation Arrows -->
        <div id="prev-media" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 40px; cursor: pointer; z-index: 2001; opacity: 0.6; padding: 20px;">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        <div id="next-media" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 40px; cursor: pointer; z-index: 2001; opacity: 0.6; padding: 20px;">
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <!-- Metadata Overlay (Lower Left) -->
        <div id="metadata-overlay" style="position: absolute; bottom: 80px; left: 30px; color: #fff; font-family: 'Inter', sans-serif; background: rgba(0,0,0,0.6); padding: 15px 20px; border-radius: 15px; z-index: 2002; display: none; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);">
            <!-- Stats populated here -->
        </div>

        <div id="modal-content"
            style="max-width: 85%; max-height: 85%; display: flex; align-items: center; justify-content: center;"></div>
        
        <!-- Caption Overlay -->
        <div id="modal-caption"
            style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Inter', sans-serif; background: rgba(0,0,0,0.5); padding: 10px 25px; border-radius: 30px; z-index: 2002;">
        </div>
    </div>
</div>

<!-- Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const API_KEY = 'AIzaSyB4KXMciiR9YisJ_1M2C5-EiiyeFJPWSlw'; 
    const ROOT_ID = '1EfIJvPEiJp48qs55RYypFcFHTJHGjqCX';

    let currentMediaList = [];
    let currentIndex = 0;
    let showMetadata = false;

    const picker = document.getElementById('gallery-picker');
    const grid = document.getElementById('gallery-grid');
    const descArea = document.getElementById('gallery-description');
    const modal = document.getElementById('media-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCaption = document.getElementById('modal-caption');
    const metaOverlay = document.getElementById('metadata-overlay');
    const metaToggle = document.getElementById('metadata-toggle');
    const closeModal = document.getElementById('close-modal');
    const prevBtn = document.getElementById('prev-media');
    const nextBtn = document.getElementById('next-media');
    const jumpToImages = document.getElementById('jump-to-images');
    const backToTop = document.getElementById('back-to-top');
    const tabsHeader = document.getElementById('tabs-header');
    const tabsContent = document.getElementById('tabs-content');

    document.addEventListener('DOMContentLoaded', () => {
        if (!API_KEY) {
            document.getElementById('api-notice').style.display = 'block';
            picker.innerHTML = '<option value="" disabled selected>API Key missing in gallery.html</option>';
            return;
        }
        initGallery();
    });

    async function initGallery() {
        try {
            const url = `https://www.googleapis.com/drive/v3/files?q='${ROOT_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            const folders = data.files.filter(f => 
                f.mimeType === 'application/vnd.google-apps.folder' || 
                f.mimeType === 'application/vnd.google-apps.shortcut'
            );

            picker.innerHTML = '<option value="" disabled selected style="background: #1e293b; color: #fff;">-- Select a Gallery --</option>';
            folders.sort((a, b) => a.name.localeCompare(b.name)).forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                option.style.background = '#1e293b';
                option.style.color = '#fff';
                picker.appendChild(option);
            });

            picker.addEventListener('change', (e) => loadFolder(e.target.value));

        } catch (err) {
            picker.innerHTML = `<option disabled selected>Error: ${err.message}</option>`;
        }
    }

    async function loadFolder(folderId) {
        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Loading assets...</div>';
        descArea.style.display = 'none';
        currentMediaList = [];
        
        try {
            // Include imageMediaMetadata and videoMediaMetadata in request
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,webContentLink,imageMediaMetadata,videoMediaMetadata)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            const files = data.files;
            const contentFiles = files.filter(f => f.name.endsWith('.md') || f.name.endsWith('.gpx'))
                                     .sort((a, b) => a.name.localeCompare(b.name));

            if (contentFiles.length > 0) {
                tabsHeader.innerHTML = '';
                tabsContent.innerHTML = '';
                descArea.style.display = 'block';

                for (const [idx, file] of contentFiles.entries()) {
                    const isFirst = idx === 0;
                    const cleanName = file.name.replace(/\.(md|gpx)$/i, '');
                    
                    // Create Tab Button
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
                    btn.textContent = cleanName;
                    btn.dataset.tabId = `tab-${idx}`;
                    btn.addEventListener('click', () => switchTab(btn, `tab-${idx}`));
                    tabsHeader.appendChild(btn);

                    // Create Tab Pane
                    const pane = document.createElement('div');
                    pane.id = `tab-${idx}`;
                    pane.className = `tab-pane ${isFirst ? 'active' : ''}`;
                    tabsContent.appendChild(pane);

                    if (file.name.endsWith('.md')) {
                        loadMarkdownTab(file, pane);
                    } else if (file.name.endsWith('.gpx')) {
                        loadGpxTab(file, pane);
                    }
                }
            }

            currentMediaList = files.filter(f => f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/'))
                                  .sort((a, b) => a.name.localeCompare(b.name));
            
            grid.innerHTML = '';
            currentMediaList.forEach((file, index) => renderMediaCard(file, index));

        } catch (err) {
            grid.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
        }
    }

    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const pane = document.getElementById(tabId);
        pane.classList.add('active');
        
        // If there's a map in this pane, invalidate size to fix rendering issues in hidden elements
        const mapDiv = pane.querySelector('.map-container');
        if (mapDiv && mapDiv._leaflet_map) {
            mapDiv._leaflet_map.invalidateSize();
        }
    }

    async function loadMarkdownTab(file, pane) {
        try {
            const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`);
            const text = await resp.text();
            
            pane.innerHTML = `
                <div class="markdown-content">${marked.parse(text)}</div>
                <button class="desc-toggle-btn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; margin-top: 15px; padding: 5px 0; display: none; font-size: 0.9rem;">
                    Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>
                </button>
            `;
            
            const content = pane.querySelector('.markdown-content');
            const toggle = pane.querySelector('.desc-toggle-btn');
            
            setTimeout(() => {
                if (content.scrollHeight > content.clientHeight + 5) {
                    toggle.style.display = 'block';
                }
            }, 200);

            toggle.addEventListener('click', () => {
                const isExpanded = content.classList.contains('expanded');
                if (isExpanded) {
                    content.classList.remove('expanded');
                    toggle.innerHTML = 'Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>';
                } else {
                    content.classList.add('expanded');
                    toggle.innerHTML = 'Read Less <i class="fa-solid fa-chevron-up" style="font-size: 0.7rem; margin-left: 5px;"></i>';
                }
            });
        } catch (e) {
            pane.innerHTML = `<p style="color:red;">Failed to load markdown: ${e.message}</p>`;
        }
    }

    function loadGpxTab(file, pane) {
        const containerId = `map-${file.id}`;
        pane.innerHTML = `<div id="${containerId}" class="map-container"></div>`;
        
        const gpxUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
        
        setTimeout(() => {
            const map = L.map(containerId).setView([43.0, -71.5], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Store map instance on DOM for invalidateSize
            document.getElementById(containerId)._leaflet_map = map;

            new L.GPX(gpxUrl, {
                async: true,
                marker_options: {
                    startIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-start.png',
                    endIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-end.png',
                    shadowUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-shadow.png'
                },
                polyline_options: {
                    color: '#4ECDC4',
                    opacity: 0.8,
                    weight: 4,
                    lineCap: 'round'
                }
            }).on('loaded', function(e) {
                map.fitBounds(e.target.getBounds());
            }).addTo(map);
        }, 100);
    }

    function renderMediaCard(file, index) {
        const isVideo = file.mimeType.startsWith('video/');
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.padding = '0';
        card.style.cursor = 'pointer';
        card.style.overflow = 'hidden';

        card.innerHTML = `
            <div style="position: relative; width: 100%; aspect-ratio: 1/1;">
                <img src="https://lh3.googleusercontent.com/d/${file.id}=s400" alt="${file.name}" style="width:100%; height:100%; object-fit:cover; transition:0.4s;">
                ${isVideo ? '<i class="fa-solid fa-play" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:1.5rem; opacity:0.7;"></i>' : ''}
            </div>
        `;

        card.addEventListener('mouseenter', () => card.querySelector('img').style.transform = 'scale(1.1)');
        card.addEventListener('mouseleave', () => card.querySelector('img').style.transform = 'scale(1)');
        card.addEventListener('click', () => { currentIndex = index; openMedia(file); });
        grid.appendChild(card);
    }

    function openMedia(file) {
        modalContent.innerHTML = '';
        modalCaption.textContent = file.name;
        
        if (file.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
            img.style.maxWidth = '100%'; img.style.maxHeight = '100%'; img.style.borderRadius = '8px';
            modalContent.appendChild(img);
            renderMetadata(file.imageMediaMetadata);
        } else if (file.mimeType.startsWith('video/')) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${file.id}/preview`;
            iframe.width = '800'; iframe.height = '450'; iframe.style.border = 'none';
            modalContent.appendChild(iframe);
            renderMetadata(file.videoMediaMetadata);
        }

        const wasOpen = modal.style.display === 'flex';
        modal.style.display = 'flex';
        metaOverlay.style.display = showMetadata ? 'block' : 'none';
        
        // Push state for back button handling ONLY if not already open
        if (!wasOpen) {
            history.pushState({ modalOpen: true }, '');
        }
    }

    function renderMetadata(meta) {
        if (!meta) {
            metaOverlay.innerHTML = '<i class="fa-solid fa-slash"></i> No Metadata Available';
            return;
        }

        let html = '<div style="display: grid; gap: 8px;">';
        if (meta.cameraMake || meta.cameraModel) html += `<div><i class="fa-solid fa-camera"></i> ${meta.cameraMake || ''} ${meta.cameraModel || ''}</div>`;
        if (meta.lens) html += `<div><i class="fa-solid fa-circle-dot"></i> ${meta.lens}</div>`;
        if (meta.focalLength) html += `<div><i class="fa-solid fa-crosshairs"></i> ${meta.focalLength}mm</div>`;
        if (meta.aperture) html += `<div><i class="fa-solid fa-circle-half-stroke"></i> f/${meta.aperture}</div>`;
        if (meta.shutterSpeed) html += `<div><i class="fa-solid fa-clock"></i> ${formatShutter(meta.shutterSpeed)}s</div>`;
        if (meta.isoSpeed) html += `<div><i class="fa-solid fa-film"></i> ISO ${meta.isoSpeed}</div>`;
        if (meta.width && meta.height) html += `<div><i class="fa-solid fa-up-right-and-down-left-from-center"></i> ${meta.width} x ${meta.height}</div>`;
        if (meta.time) html += `<div><i class="fa-solid fa-calendar-day"></i> ${new Date(meta.time).toLocaleDateString()}</div>`;
        html += '</div>';
        metaOverlay.innerHTML = html;
    }

    function formatShutter(speed) {
        if (!speed) return '';
        if (speed < 1) {
            return `1/${Math.round(1/speed)}`;
        }
        return speed;
    }

    metaToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        showMetadata = !showMetadata;
        metaOverlay.style.display = showMetadata ? 'block' : 'none';
        metaToggle.style.background = showMetadata ? 'var(--accent)' : 'rgba(255,255,255,0.1)';
        metaToggle.style.color = showMetadata ? '#000' : '#fff';
    });

    function showPrev() { currentIndex = (currentIndex - 1 + currentMediaList.length) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }
    function showNext() { currentIndex = (currentIndex + 1) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }

    function closeModalHandler() {
        if (modal.style.display === 'flex') {
            if (history.state && history.state.modalOpen) {
                history.back(); // This will trigger the popstate event below
            } else {
                hideModal();
            }
        }
    }

    function hideModal() {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
    }


    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
    closeModal.addEventListener('click', closeModalHandler);
    
    window.addEventListener('click', (e) => { if (e.target === modal) closeModalHandler(); });

    window.addEventListener('popstate', (e) => {
        hideModal();
    });

    // Jump to images logic
    jumpToImages.addEventListener('click', () => {
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Back to top logic
    window.addEventListener('scroll', () => {
        if (window.scrollY > 400) {
            backToTop.style.display = 'flex';
        } else {
            backToTop.style.display = 'none';
        }
    });

    backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    backToTop.addEventListener('mouseenter', () => {
        backToTop.style.transform = 'translateY(-5px)';
        backToTop.style.background = '#fff';
    });
    backToTop.addEventListener('mouseleave', () => {
        backToTop.style.transform = 'translateY(0)';
        backToTop.style.background = 'var(--accent)';
    });

    jumpToImages.addEventListener('mouseenter', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.2)';
        jumpToImages.style.borderColor = 'var(--accent)';
    });
    jumpToImages.addEventListener('mouseleave', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.1)';
        jumpToImages.style.borderColor = 'var(--glass-border)';
    });

    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') closeModal.click();
            else if (e.key === 'ArrowLeft') showPrev();
            else if (e.key === 'ArrowRight') showNext();
            else if (e.key.toLowerCase() === 'i') metaToggle.click();
        }
    });
</script>
