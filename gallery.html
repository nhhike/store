<script>
    const API_KEY = 'AIzaSyBdeKIvJP-KmV0JEkD84iTTc1GaCzRr5xk';
    const ROOT_ID = '1EfIJvPEiJp48qs55RYypFcFHTJHGjqCX';

    let currentMediaList = [];
    let currentIndex = 0;
    let showMetadata = false;

    const grid = document.getElementById('gallery-grid');
    const descArea = document.getElementById('gallery-description');
    const modal = document.getElementById('media-modal');
    const modalContent = document.getElementById('modal-content');
    const modalCaption = document.getElementById('modal-caption');
    const metaOverlay = document.getElementById('metadata-overlay');
    const metaToggle = document.getElementById('metadata-toggle');
    const closeModal = document.getElementById('close-modal');
    const prevBtn = document.getElementById('prev-media');
    const nextBtn = document.getElementById('next-media');
    const jumpToImages = document.getElementById('jump-to-images');
    const backToTop = document.getElementById('back-to-top');
    const tabsHeader = document.getElementById('tabs-header');
    const tabsContent = document.getElementById('tabs-content');

    document.addEventListener('DOMContentLoaded', () => {
        if (!API_KEY) {
            document.getElementById('api-notice').style.display = 'block';
            document.getElementById('selected-label').textContent = 'API Key missing';
            return;
        }
        initGallery();
    });

    async function initGallery() {
        try {
            const container = document.getElementById('pickers-container');
            
            // 1. Fetch Top Level Regions
            const url = `https://www.googleapis.com/drive/v3/files?q='${ROOT_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            const regions = data.files.filter(f =>
                f.mimeType === 'application/vnd.google-apps.folder' ||
                f.mimeType === 'application/vnd.google-apps.shortcut'
            ).sort((a, b) => a.name.localeCompare(b.name));

            if (regions.length === 0) {
                container.innerHTML = '<p>No regions found in gallery root.</p>';
                return;
            }

            container.innerHTML = ''; // Clear spinner

            // 2. For each region, create a picker
            for (const region of regions) {
                createPickerForRegion(region);
            }

            // Close all dropdowns when clicking outside
            window.addEventListener('click', () => {
                document.querySelectorAll('.picker-dropdown').forEach(d => d.classList.remove('show'));
                document.querySelectorAll('.picker-trigger').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.custom-picker').forEach(p => p.classList.remove('active'));
            });

        } catch (err) {
            console.error('Gallery init failed:', err);
            const container = document.getElementById('pickers-container');
            if (container) container.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
        }
    }

    async function createPickerForRegion(region) {
        const container = document.getElementById('pickers-container');
        
        // Create Picker HTML
        const pickerDiv = document.createElement('div');
        pickerDiv.className = 'custom-picker';
        pickerDiv.innerHTML = `
            <div class="picker-label-top">${region.name}</div>
            <div class="picker-trigger" id="trigger-${region.id}">
                <span class="selected-label">-- Select Collection --</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
            </div>
            <div class="picker-dropdown" id="dropdown-${region.id}">
                <div style="padding: 10px; text-align: center;"><i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>
        `;
        container.appendChild(pickerDiv);

        const trigger = pickerDiv.querySelector('.picker-trigger');
        const dropdown = pickerDiv.querySelector('.picker-dropdown');
        const label = pickerDiv.querySelector('.selected-label');

        trigger.onclick = async (e) => {
            e.stopPropagation();
            
            // Toggle current
            const isOpen = dropdown.classList.contains('show');
            
            // Close others and reset z-indexes
            document.querySelectorAll('.picker-dropdown').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('.picker-trigger').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.custom-picker').forEach(p => p.classList.remove('active'));

            if (!isOpen) {
                trigger.classList.add('active');
                dropdown.classList.add('show');
                pickerDiv.classList.add('active'); // Boost z-index to stay above other pickers
                
                // Fetch sub-folders if not already loaded
                if (dropdown.dataset.loaded !== 'true') {
                    await populateDropdown(region.id, dropdown, label, trigger);
                }
            }
        };
    }

    async function populateDropdown(regionId, dropdown, label, trigger) {
        try {
            const url = `https://www.googleapis.com/drive/v3/files?q='${regionId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            const collections = (data.files || []).filter(f =>
                f.mimeType === 'application/vnd.google-apps.folder' ||
                f.mimeType === 'application/vnd.google-apps.shortcut'
            ).sort((a, b) => b.name.localeCompare(a.name)); // Sort descending by name (years usually at front)

            dropdown.innerHTML = '';
            
            if (collections.length === 0) {
                dropdown.innerHTML = '<div style="padding: 10px; font-size: 0.7rem; color: #888;">No collections found</div>';
                return;
            }

            collections.forEach(item => {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.textContent = item.name;
                div.onclick = (e) => {
                    e.stopPropagation();
                    
                    // Reset all other labels
                    document.querySelectorAll('.selected-label').forEach(l => l.textContent = '-- Select Collection --');
                    
                    label.textContent = item.name;
                    dropdown.classList.remove('show');
                    trigger.classList.remove('active');
                    loadFolder(item.id);
                };
                dropdown.appendChild(div);
            });

            dropdown.dataset.loaded = 'true';

        } catch (err) {
            console.error('Failed to populate dropdown:', err);
            dropdown.innerHTML = '<div style="padding: 10px; color: red;">Error loading items</div>';
        }
    }

    async function loadFolder(folderId) {
        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Loading assets...</div>';
        descArea.style.display = 'none';
        currentMediaList = [];

        try {
            // Remove MIME type restrictions to catch files Google labels incorrectly
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,webContentLink,imageMediaMetadata,videoMediaMetadata)&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            const allFiles = data.files || [];
            
            // Client-side filtering by extension
            const textFiles = prepareTabData(allFiles.filter(f => f.name.toLowerCase().endsWith('.md')));
            const mapFiles = prepareTabData(allFiles.filter(f => f.name.toLowerCase().endsWith('.gpx') || f.name.toLowerCase().endsWith('.kml')));
            const imageVideoFiles = allFiles.filter(f => f.mimeType && (f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/')));

            if (textFiles.length > 0 || mapFiles.length > 0) {
                const textRow = document.getElementById('text-tabs-row');
                const mapRow = document.getElementById('map-tabs-row');
                const midDiv = document.getElementById('tabs-middle-divider');

                textRow.innerHTML = '';
                mapRow.innerHTML = '';
                midDiv.style.display = (textFiles.length > 0 && mapFiles.length > 0) ? 'block' : 'none';

                tabsContent.innerHTML = '';
                descArea.style.display = 'block';

                let tabIdx = 0;

                // Render Text Tabs
                textFiles.forEach((file) => {
                    createTabElements(file, tabIdx++, tabIdx === 1, textRow);
                });

                // Render Map Tabs
                mapFiles.forEach((file) => {
                    createTabElements(file, tabIdx++, tabIdx === 1, mapRow);
                });
            }

            currentMediaList = imageVideoFiles.sort((a, b) => a.name.localeCompare(b.name));

            grid.innerHTML = '';
            currentMediaList.forEach((file, index) => renderMediaCard(file, index));

        } catch (err) {
            console.error('Folder load error:', err);
            grid.innerHTML = `<p style="color: red;">Error loading folder: ${err.message}</p>`;
        }
    }

    function prepareTabData(files) {
        return files.map(file => {
            const name = file.name;
            const match = name.match(/^(\d{1,2})\s*(.*)/);
            const order = match ? parseInt(match[1], 10) : Infinity;
            const remainingName = match ? match[2] : name;
            const cleanName = remainingName.replace(/\.(md|gpx|kml)$/i, '');
            return { ...file, order, cleanName };
        }).sort((a, b) => {
            if (a.order !== b.order) return a.order - b.order;
            return a.name.localeCompare(b.name);
        });
    }

    function createTabElements(file, idx, isFirst, container) {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${isFirst ? 'active' : ''}`;

        // Add icons based on file type
        const iconClass = file.name.endsWith('.md') ? 'fa-regular fa-file-lines' : 'fa-solid fa-satellite-dish';
        btn.innerHTML = `<i class="${iconClass}" style="margin-right: 6px; opacity: 0.8;"></i> ${file.cleanName}`;

        btn.dataset.tabId = `tab-${idx}`;
        btn.addEventListener('click', () => switchTab(btn, `tab-${idx}`));
        container.appendChild(btn);

        const pane = document.createElement('div');
        pane.id = `tab-${idx}`;
        pane.className = `tab-pane ${isFirst ? 'active' : ''}`;
        tabsContent.appendChild(pane);

        if (file.name.endsWith('.md')) {
            loadMarkdownTab(file, pane);
        } else {
            loadMapTab(file, pane);
        }
    }

    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const pane = document.getElementById(tabId);
        pane.classList.add('active');

        // Ensure "Read More" logic is recalculated if it was missed
        const toggle = pane.querySelector('.desc-toggle-btn');
        const wrapper = pane.querySelector('.collapsible-wrapper');
        const inner = pane.querySelector('.collapsible-inner');
        if (toggle && inner && wrapper && !wrapper.classList.contains('expanded')) {
            if (inner.scrollHeight > 145) toggle.style.display = 'block';
        }

        // If there's a map in this pane, invalidate size to fix rendering issues
        const mapDiv = pane.querySelector('.map-container');
        if (mapDiv && mapDiv._leaflet_map) {
            setTimeout(() => {
                mapDiv._leaflet_map.invalidateSize();
                // If it's the first time or bounds aren't set, try to fit bounds again
                if (mapDiv._leaflet_track) {
                    mapDiv._leaflet_map.fitBounds(mapDiv._leaflet_track.getBounds());
                }
            }, 100);
        }
    }
    async function robustFetch(targetUrl, attempt = 1, maxAttempts = 4) {
        try {
            // Force cache busting to avoid stale proxy/browser cache from previous errors
            const freshUrl = targetUrl + (targetUrl.includes('?') ? '&' : '?') + '_ts=' + Date.now();
            
            const resp = await fetch(freshUrl);
            if (resp.ok) {
                return await resp.text();
            } else if (resp.status === 403 || resp.status === 429) {
                // Rate limited or temporary forbidden, throw to trigger retry
                throw new Error(`Google Drive API Rate Limit (Status ${resp.status})`);
            } else {
                throw new Error(`Fetch failed with status ${resp.status}`);
            }
        } catch (e) {
            if (attempt < maxAttempts) {
                // Exponential backoff: 1s, 2s, 4s...
                const delay = Math.pow(2, attempt - 1) * 1000;
                console.warn(`Fetch attempt ${attempt} failed, retrying in ${delay}ms...`, e);
                await new Promise(r => setTimeout(r, delay));
                return await robustFetch(targetUrl, attempt + 1, maxAttempts);
            }
            throw new Error("Unable to fetch data from Google Drive after multiple attempts.");
        }
    }

    async function loadMarkdownTab(file, pane) {
        console.log(`Loading Tab: ${file.name} | MIME: ${file.mimeType}`);
        try {
            const target = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
            let text = await robustFetch(target);
            
            if (text.trim().startsWith('data:')) {
                const base64Part = text.split(',')[1];
                text = atob(base64Part);
            }

            if (!text) throw new Error('Content unavailable');
            const contentHtml = marked.parse(text);
            initCollapsiblePane(pane, contentHtml);

        } catch (e) {
            console.error('Markdown load error:', e);
            pane.innerHTML = `
                <div style="padding: 20px; text-align: center; color: #ff6b6b; background: rgba(255,0,0,0.05); border-radius: 12px; border: 1px solid rgba(255,107,107,0.2);">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    <p style="font-weight: 600;">Failed to load "${file.name}"</p>
                    <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 5px;">${e.message}</p>
                    <button onclick="location.reload()" style="margin-top: 15px; background: var(--accent); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem;">Retry Boarding</button>
                </div>
            `;
        }
    }

async function loadMapTab(file, pane) {
        const containerId = `map-${file.id}`;

        try {
            const target = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
            let data = await robustFetch(target);
            
            if (data.trim().startsWith('data:')) {
                const base64Part = data.split(',')[1];
                data = atob(base64Part);
            }
            
            if (!data) throw new Error('Map data unavailable');

            const safeFileName = file.name.replace(/'/g, "\\'");
            const mapHtml = `
                <div style="position: relative;">
                    <button onclick="downloadFile('${file.id}', '${safeFileName}')" 
                        style="position: absolute; top: 15px; right: 15px; z-index: 1000; background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s;"
                        onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        <i class="fa-solid fa-download"></i> Download GPX
                    </button>
                    <div id="${containerId}" class="map-container"></div>
                </div>`;
            initCollapsiblePane(pane, mapHtml, true); // true = autoExpand for maps

            setTimeout(() => {
                const mapDiv = document.getElementById(containerId);
                if (!mapDiv) return;

                const map = L.map(containerId).setView([43.0, -71.5], 10);
                L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    maxZoom: 17,
                    attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
                }).addTo(map);

                mapDiv._leaflet_map = map;

                const layer = file.name.endsWith('.gpx')
                    ? new L.GPX(data, {
                        async: true,
                        marker_options: {
                            startIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-start.png',
                            endIconUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-icon-end.png',
                            shadowUrl: 'https://unpkg.com/leaflet-gpx@1.7.0/pin-shadow.png'
                        }
                    })
                    : omnivore.kml(data);

                layer.on('loaded', function (e) {
                    const bounds = e.target ? e.target.getBounds() : layer.getBounds();
                    if (bounds && bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                    mapDiv._leaflet_track = e.target || layer;
                }).addTo(map);

                layer.on('error', function (e) {
                    console.warn('Leaflet layer parse error:', e);
                    pane.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff6b6b;">GPX Parse Error: Ensure file is valid GPX/KML.</div>`;
                });

                if (file.name.endsWith('.kml')) {
                    setTimeout(() => {
                        const b = layer.getBounds();
                        if (b && b.isValid()) map.fitBounds(b);
                    }, 1000);
                }

            }, 500);

        } catch (e) {
            console.error('Map load error:', e);
            const errorMsg = e.message.includes('HTTP 403') ? 'Google Drive Access Denied (Check API Key/Sharing)' : e.message;
            pane.innerHTML = `
                <div style="padding: 30px; text-align: center; background: rgba(255,0,0,0.05); border: 1px solid rgba(255,0,0,0.2); border-radius: 12px;">
                    <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; color: #ff6b6b; margin-bottom: 15px; display: block;"></i>
                    <div style="color: #ff6b6b; font-weight: 700; margin-bottom: 5px;">Failed to load Map data</div>
                    <div style="color: #fff; font-size: 0.8rem; opacity: 0.8;">"${file.name}"</div>
                    <div style="color: #ff6b6b; font-size: 0.75rem; margin-top: 10px; font-family: monospace;">Error: ${errorMsg}</div>
                    <button onclick="switchTab(document.querySelector('.tab-btn.active'), '${pane.id}')" style="margin-top: 15px; background: var(--accent); border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; font-weight: bold;">Retry</button>
                </div>`;
        }
    }

    function initCollapsiblePane(pane, innerHtml, autoExpand = false) {
        pane.innerHTML = `
            <div class="collapsible-wrapper">
                <div class="collapsible-inner">${innerHtml}</div>
            </div>
            <button class="desc-toggle-btn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; margin-top: 15px; padding: 5px 0; display: none; font-size: 0.9rem;">
                Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>
            </button>
        `;

        const wrapper = pane.querySelector('.collapsible-wrapper');
        const inner = pane.querySelector('.collapsible-inner');
        const toggle = pane.querySelector('.desc-toggle-btn');

        if (autoExpand) {
            wrapper.classList.add('expanded');
            toggle.style.display = 'none'; // No need for toggle if auto-expanded
        }

        setTimeout(() => {
            if (!autoExpand && inner.scrollHeight > 150) {
                toggle.style.display = 'block';
            }
        }, 800);

        toggle.addEventListener('click', () => {
            const isExpanded = wrapper.classList.contains('expanded');
            if (isExpanded) {
                wrapper.classList.remove('expanded');
                toggle.innerHTML = 'Read More <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px;"></i>';
            } else {
                wrapper.classList.add('expanded');
                toggle.innerHTML = 'Read Less <i class="fa-solid fa-chevron-up" style="font-size: 0.7rem; margin-left: 5px;"></i>';
            }

            // Fix map if it was just expanded
            const mapDiv = wrapper.querySelector('.map-container');
            if (mapDiv && mapDiv._leaflet_map) {
                setTimeout(() => mapDiv._leaflet_map.invalidateSize(), 500);
            }
        });
    }

    function renderMediaCard(file, index) {
        const isVideo = file.mimeType.startsWith('video/') || file.name.toLowerCase().endsWith('.gif') || file.name.toLowerCase().endsWith('.webm');
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.padding = '0';
        card.style.cursor = 'pointer';
        card.style.overflow = 'hidden';

        card.innerHTML = `
            <div style="position: relative; width: 100%; aspect-ratio: 1/1;">
                <img src="https://lh3.googleusercontent.com/d/${file.id}=s400" alt="${file.name}" style="width:100%; height:100%; object-fit:cover; transition:0.4s;">
                ${isVideo ? '<i class="fa-solid fa-circle-play" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--accent); font-size:2rem; opacity:0.95; text-shadow: 0 0 15px rgba(0,0,0,0.6);"></i>' : ''}
            </div>
        `;

        card.addEventListener('mouseenter', () => card.querySelector('img').style.transform = 'scale(1.1)');
        card.addEventListener('mouseleave', () => card.querySelector('img').style.transform = 'scale(1)');
        card.addEventListener('click', () => { currentIndex = index; openMedia(file); });
        grid.appendChild(card);
    }

    let zoomScale = 1;
    let zoomPosX = 0;
    let zoomPosY = 0;
    let lastTapTime = 0;
    let ticking = false;

    const updateTransform = (smooth = false) => {
        if (!ticking || smooth) {
            ticking = true;
            requestAnimationFrame(() => {
                const img = modalContent.querySelector('img');
                if (img) {
                    img.style.transition = smooth ? 'transform 0.3s cubic-bezier(0.2, 0, 0.2, 1)' : 'none';
                    img.style.transform = `translate(${zoomPosX}px, ${zoomPosY}px) scale(${zoomScale})`;
                }
                ticking = false;
            });
        }
    };

    function openMedia(file) {
        modalContent.innerHTML = '';
        modalCaption.textContent = file.name;
        zoomScale = 1; zoomPosX = 0; zoomPosY = 0; // Reset state
        document.body.style.overflow = 'hidden'; // Prevent background scroll
        document.body.style.touchAction = 'none'; // Lock page zoom

        if (file.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${file.id}=s0`;
            img.style.maxWidth = '100%'; img.style.maxHeight = '100%'; img.style.borderRadius = '8px';
            img.style.transition = 'transform 0.1s ease-out';
            img.style.touchAction = 'none'; // Prevent page scrolling while zooming image
            img.style.cursor = 'ns-resize'; // Indicates scroll wheel action

            setupZoom(img);
            modalContent.appendChild(img);
            renderMetadata(file.imageMediaMetadata);
        } else if (file.mimeType.startsWith('video/')) {
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${file.id}/preview`;
            iframe.width = '800'; iframe.height = '450'; iframe.style.border = 'none';
            modalContent.appendChild(iframe);
            renderMetadata(file.videoMediaMetadata);
        }

        const wasOpen = modal.style.display === 'flex';
        modal.style.display = 'flex';
        metaOverlay.style.display = showMetadata ? 'block' : 'none';

        // Push state for back button handling ONLY if not already open
        if (!wasOpen) {
            history.pushState({ modalOpen: true }, '');
        }
    }

    function setupZoom(img) {
        // This function is now a placeholder as logic moved to modal-level
        img.draggable = false;
        img.style.userSelect = 'none';
    }

    let evCache = [];
    let prevDiff = -1;
    let lastPosX = 0;
    let lastPosY = 0;

    const modalUpdateTransform = (smooth = false) => {
        const img = modalContent.querySelector('img');
        if (!img) return;
        img.style.transition = smooth ? 'transform 0.3s cubic-bezier(0.2, 0, 0.2, 1)' : 'none';
        img.style.transform = `translate(${zoomPosX}px, ${zoomPosY}px) scale(${zoomScale})`;
        img.style.cursor = zoomScale > 1 ? 'grab' : 'ns-resize';
    };

    let isPanning = false;
    let initialPinchDist = 0;
    const activePointers = new Map();

    modal.onwheel = (e) => {
        if (modal.style.display !== 'flex') return;
        const img = modalContent.querySelector('img');
        if (!img) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.85 : 1.15;
        zoomScale = Math.max(1, Math.min(zoomScale * delta, 5));
        modalUpdateTransform(true);
    };

    modal.onpointerdown = (e) => {
        if (modal.style.display !== 'flex') return;
        const img = modalContent.querySelector('img');
        const isUI = e.target.closest('#prev-media') || e.target.closest('#next-media') ||
            e.target.closest('#close-modal') || e.target.closest('#metadata-toggle');
        if (!img || isUI) return;

        e.preventDefault();
        // Move to Map-based per-pointer tracking
        activePointers.set(e.pointerId, {
            lastX: e.clientX,
            lastY: e.clientY,
            startX: e.clientX,
            startY: e.clientY
        });
        modal.setPointerCapture(e.pointerId);

        if (activePointers.size === 1) {
            isPanning = true;
            if (zoomScale > 1) img.style.cursor = 'grabbing';

            const now = Date.now();
            if (now - lastTapTime < 300) {
                zoomScale = 1; zoomPosX = 0; zoomPosY = 0;
                modalUpdateTransform(true);
                lastTapTime = 0;
                return;
            }
            lastTapTime = now;
        } else if (activePointers.size === 2) {
            isPanning = false;
            const pts = Array.from(activePointers.values());
            initialPinchDist = Math.hypot(pts[0].lastX - pts[1].lastX, pts[0].lastY - pts[1].lastY);
        }
    };

    modal.onpointermove = (e) => {
        if (modal.style.display !== 'flex' || !activePointers.has(e.pointerId)) return;

        const img = modalContent.querySelector('img');
        if (!img) return;
        e.preventDefault();

        const pData = activePointers.get(e.pointerId);

        if (activePointers.size === 2) {
            pData.lastX = e.clientX;
            pData.lastY = e.clientY;
            const pts = Array.from(activePointers.values());
            const curDist = Math.hypot(pts[0].lastX - pts[1].lastX, pts[0].lastY - pts[1].lastY);
            if (initialPinchDist > 0) {
                const ratio = curDist / initialPinchDist;
                zoomScale = Math.max(1, Math.min(zoomScale * ratio, 5));
                initialPinchDist = curDist;
                modalUpdateTransform();
            }
        } else if (isPanning && zoomScale > 1) {
            const dx = e.clientX - pData.lastX;
            const dy = e.clientY - pData.lastY;
            zoomPosX += dx;
            zoomPosY += dy;
            modalUpdateTransform();
        }

        pData.lastX = e.clientX;
        pData.lastY = e.clientY;
    };

    const stopModalGesture = (e) => {
        const pData = activePointers.get(e.pointerId);
        if (pData) {
            const distMoved = Math.hypot(e.clientX - pData.startX, e.clientY - pData.startY);
            // ONLY close if they tapped with almost no movement (less than 5px)
            if (distMoved < 5 && e.target === modal && activePointers.size === 1) {
                closeModalHandler();
            }
        }

        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) initialPinchDist = 0;
        if (activePointers.size === 0) isPanning = false;

        const img = modalContent.querySelector('img');
        if (img) img.style.cursor = zoomScale > 1 ? 'grab' : 'ns-resize';
    };

    modal.onpointerup = stopModalGesture;
    modal.onpointercancel = stopModalGesture;
    modal.onpointerleave = stopModalGesture;

    function renderMetadata(meta) {
        if (!meta) {
            metaOverlay.innerHTML = '<i class="fa-solid fa-slash"></i> No Metadata Available';
            return;
        }

        let html = '<div style="display: grid; gap: 8px;">';
        if (meta.cameraMake || meta.cameraModel) html += `<div><i class="fa-solid fa-camera"></i> ${meta.cameraMake || ''} ${meta.cameraModel || ''}</div>`;
        if (meta.lens) html += `<div><i class="fa-solid fa-circle-dot"></i> ${meta.lens}</div>`;
        if (meta.focalLength) html += `<div><i class="fa-solid fa-crosshairs"></i> ${meta.focalLength}mm</div>`;
        if (meta.aperture) html += `<div><i class="fa-solid fa-circle-half-stroke"></i> f/${meta.aperture}</div>`;
        if (meta.shutterSpeed) html += `<div><i class="fa-solid fa-clock"></i> ${formatShutter(meta.shutterSpeed)}s</div>`;
        if (meta.isoSpeed) html += `<div><i class="fa-solid fa-film"></i> ISO ${meta.isoSpeed}</div>`;
        if (meta.width && meta.height) html += `<div><i class="fa-solid fa-up-right-and-down-left-from-center"></i> ${meta.width} x ${meta.height}</div>`;
        if (meta.time) html += `<div><i class="fa-solid fa-calendar-day"></i> ${new Date(meta.time).toLocaleDateString()}</div>`;
        html += '</div>';
        metaOverlay.innerHTML = html;
    }

    function formatShutter(speed) {
        if (!speed) return '';
        if (speed < 1) {
            return `1/${Math.round(1 / speed)}`;
        }
        return speed;
    }

    metaToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        showMetadata = !showMetadata;
        metaOverlay.style.display = showMetadata ? 'block' : 'none';
        metaToggle.style.background = showMetadata ? 'var(--accent)' : 'rgba(255,255,255,0.1)';
        metaToggle.style.color = showMetadata ? '#000' : '#fff';
    });

    function showPrev() { currentIndex = (currentIndex - 1 + currentMediaList.length) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }
    function showNext() { currentIndex = (currentIndex + 1) % currentMediaList.length; openMedia(currentMediaList[currentIndex]); }

    function closeModalHandler() {
        if (modal.style.display === 'flex') {
            if (history.state && history.state.modalOpen) {
                history.back(); // This will trigger the popstate event below
            } else {
                hideModal();
            }
        }
    }

    function hideModal() {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
        document.body.style.overflow = 'auto'; // Restore scroll
        document.body.style.touchAction = 'auto';
    }


    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
    closeModal.addEventListener('click', closeModalHandler);



    window.addEventListener('popstate', (e) => {
        if (zoomScale > 1.05 && modal.style.display === 'flex') {
            zoomScale = 1; zoomPosX = 0; zoomPosY = 0;
            modalUpdateTransform(true);
            // Re-push state so the NEXT back button closes it
            history.pushState({ modalOpen: true }, '');
        } else {
            hideModal();
        }
    });

    // Jump to images logic
    jumpToImages.addEventListener('click', () => {
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Back to top logic
    window.addEventListener('scroll', () => {
        if (window.scrollY > 400) {
            backToTop.style.display = 'flex';
        } else {
            backToTop.style.display = 'none';
        }
    });

    backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    backToTop.addEventListener('mouseenter', () => {
        backToTop.style.transform = 'translateY(-5px)';
        backToTop.style.background = '#fff';
    });
    backToTop.addEventListener('mouseleave', () => {
        backToTop.style.transform = 'translateY(0)';
        backToTop.style.background = 'var(--accent)';
    });

    jumpToImages.addEventListener('mouseenter', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.2)';
        jumpToImages.style.borderColor = 'var(--accent)';
    });
    jumpToImages.addEventListener('mouseleave', () => {
        jumpToImages.style.background = 'rgba(255,255,255,0.1)';
        jumpToImages.style.borderColor = 'var(--glass-border)';
    });

    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') closeModal.click();
            else if (e.key === 'ArrowLeft') showPrev();
            else if (e.key === 'ArrowRight') showNext();
            else if (e.key.toLowerCase() === 'i') metaToggle.click();
        }
    });

    async function downloadFile(fileId, fileName) {
        try {
            const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
            // Use the same reliable bridge system the map uses
            let data = await robustFetch(url);
            
            // Decrypt if Google wrapped it
            if (data && typeof data === 'string' && data.trim().startsWith('data:')) {
                const base64Part = data.split(',')[1];
                data = atob(base64Part);
            }

            // Creating a Blob allows the browser to bypass cross-origin restrictions on 'download' attribute
            const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
            const objectUrl = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(objectUrl), 100);
            
        } catch (e) {
            console.error('Safe download failed:', e);
            // Absolute worst-case fallback: gracefully open the file standardly.
            window.open(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`, '_blank');
        }
    }
</script>
