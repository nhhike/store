---
layout: default
title: Home
---
<!-- Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<header class="hero">
    <div class="hero-content">
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>
        <a href="{{ '/gallery.html' | relative_url }}" class="btn">Explore Image Gallery</a>
    </div>
</header>

<main class="main-content" style="max-width: 1200px; margin: 40px auto; padding: 0 20px 80px;">
    <div style="text-align: center; margin-bottom: 50px;">
        <h2 style="color: var(--accent); font-size: 2.2rem; margin-bottom: 10px;">Latest Trekking Stories</h2>
        <p style="color: var(--text-secondary); opacity: 0.8;">Fresh captures and insights from the Granite State.</p>
    </div>

    <!-- Blog Card Grid -->
    <div id="blog-feed"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; width: 100%; padding: 0;">
        <div style="text-align: center; width: 100%; color: var(--text-secondary); padding: 40px; grid-column: 1/-1;">
            <i class="fa-solid fa-spinner fa-spin"></i> Discovering stories...
        </div>
    </div>
</main>

<style>
    #back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        z-index: 1000;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        transition: 0.3s;
    }

    #back-to-top:hover {
        transform: translateY(-5px);
        background: #fff;
    }

    /* Ensure markdown content inside cards is consistently white/light-grey */
    .blog-full-text p {
        color: #ddd !important;
        opacity: 0.95;
        margin-bottom: 20px;
        min-height: auto !important;
        /* Fix inherited min-height */
    }

    .blog-full-text h1,
    .blog-full-text h2,
    .blog-full-text h3 {
        color: #fff !important;
        margin: 30px 0 15px;
    }

    .blog-full-text ul,
    .blog-full-text ol {
        margin-bottom: 25px;
        padding-left: 20px;
        color: #ddd;
    }
</style>

<button id="back-to-top" title="Go to top">
    <i class="fa-solid fa-arrow-up"></i>
</button>

<script>
    const API_KEY = 'AIzaSyBdeKIvJP-KmV0JEkD84iTTc1GaCzRr5xk';
    const BLOG_ROOT_ID = '1vv1nHvI57tnVJmFbUicrZ2FzErHjgjVm'; // NH-HIKE-BLOG folder ID

    const backToTop = document.getElementById('back-to-top');

    async function robustFetch(targetUrl, attempt = 1, maxAttempts = 4) {
        try {
            // Force cache busting to avoid stale proxy/browser cache from previous errors
            const freshUrl = targetUrl + (targetUrl.includes('?') ? '&' : '?') + '_ts=' + Date.now();
            
            const resp = await fetch(freshUrl);
            if (resp.ok) {
                return await resp.text();
            } else if (resp.status === 403 || resp.status === 429) {
                // Rate limited or temporary forbidden, throw to trigger retry
                throw new Error(`Google Drive API Rate Limit (Status ${resp.status})`);
            } else {
                throw new Error(`Fetch failed with status ${resp.status}`);
            }
        } catch (e) {
            if (attempt < maxAttempts) {
                // Exponential backoff: 1s, 2s, 4s...
                const delay = Math.pow(2, attempt - 1) * 1000;
                console.warn(`Fetch attempt ${attempt} failed, retrying in ${delay}ms...`, e);
                await new Promise(r => setTimeout(r, delay));
                return await robustFetch(targetUrl, attempt + 1, maxAttempts);
            }
            throw new Error("Unable to fetch data from Google Drive after multiple attempts.");
        }
    }

    async function initBlog() {
        const feed = document.getElementById('blog-feed');
        if (!BLOG_ROOT_ID || BLOG_ROOT_ID.includes('EXAMPLE')) {
            feed.innerHTML = '<div style="opacity: 0.5;">Add your NH-HIKE-BLOG Folder ID to the config to see latest stories.</div>';
            return;
        }

        try {
            // Updated to your recommended Wide-Net query
            const url = `https://www.googleapis.com/drive/v3/files?q='${BLOG_ROOT_ID}'+in+parents+and+trashed=false&fields=files(id,name,modifiedTime,mimeType)&orderBy=modifiedTime+desc&key=${API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);
            
            if (!data.files || data.files.length === 0) {
                feed.innerHTML = '<div style="opacity: 0.5; padding: 40px; text-align: center; width: 100%; grid-column: 1/-1;">No stories found in the blog folder yet.</div>';
                return;
            }

            feed.innerHTML = '';
            // Filter using your recommended .endsWith('.md') safety net
            const posts = data.files.filter(file => 
                file.name.toLowerCase().endsWith('.md')
            );

            if (posts.length === 0) {
                feed.innerHTML = '<div style="opacity: 0.5; padding: 40px; text-align: center; width: 100%; grid-column: 1/-1;">No .md files found in the NH-HIKE-BLOG folder.</div>';
                return;
            }

            posts.forEach(file => renderBlogCard(file, feed));

        } catch (err) {
            console.error('Blog load failed:', err);
            feed.innerHTML = `<div style="color: var(--accent); padding: 40px; text-align: center; width: 100%; grid-column: 1/-1;">Notice: Connection to NH-HIKE-BLOG pending.</div>`;
        }
    }

    async function renderBlogCard(file, container) {
        console.log(`Loading Blog Card: ${file.name} | MIME: ${file.mimeType}`);
        const target = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`;
        
        try {
            let text = await robustFetch(target);
            
            // NEW: Strip data URL wrapper if present (suggested fix)
            if (text.trim().startsWith('data:')) {
                const base64Part = text.split(',')[1];
                text = atob(base64Part);   // decode base64 to plain text
                console.log('Decoded data URL for:', file.name);
            }
            
            if (!text || text.includes('error')) throw new Error('Empty file content');
            
            const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#') && !l.trim().startsWith('`'));
            const preview = lines[0] ? lines[0].substring(0, 240) + '...' : 'Dive into this trekking story...';
            const date = new Date(file.modifiedTime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

            const card = document.createElement('div');
            card.className = 'app-card';
            card.style.width = '100%';
            card.style.maxWidth = 'none';
            card.style.transition = '0.4s';

            card.innerHTML = `
                <div style="font-size: 0.75rem; color: var(--accent); margin-bottom: 15px; opacity: 0.8; font-family: 'Inter', sans-serif;">
                    <i class="fa-regular fa-calendar" style="margin-right: 5px;"></i> ${date}
                </div>
                <h3 style="font-size: 2rem; margin-bottom: 20px;">${file.name.replace('.md', '')}</h3>
                
                <div class="blog-preview-text" style="font-size: 1rem; line-height: 1.6; color: var(--text-secondary);">
                    <p>${preview}</p>
                </div>
                <div class="blog-full-text" style="display: none; font-size: 1rem; line-height: 1.8; color: #eee; margin-top: 20px;">
                    ${marked.parse(text)}
                </div>

                <div class="blog-toggle" style="color: var(--accent); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-top: 25px; user-select: none;">
                    <span class="toggle-label">Read Story</span> <i class="fa-solid fa-arrow-right"></i>
                </div>
            `;

            const previewDiv = card.querySelector('.blog-preview-text');
            const fullDiv = card.querySelector('.blog-full-text');
            const toggle = card.querySelector('.blog-toggle');
            const label = toggle.querySelector('.toggle-label');
            const icon = toggle.querySelector('i');

            toggle.onclick = (e) => {
                e.stopPropagation();
                const isExpanded = fullDiv.style.display === 'block';
                if (isExpanded) {
                    fullDiv.style.display = 'none';
                    previewDiv.style.display = 'block';
                    label.textContent = 'Read Story';
                    icon.className = 'fa-solid fa-arrow-right';
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    fullDiv.style.display = 'block';
                    previewDiv.style.display = 'none';
                    label.textContent = 'Read Less';
                    icon.className = 'fa-solid fa-arrow-up';
                }
            };

            container.appendChild(card);
        } catch (e) {
            console.error('Card render failed:', e);
        }
    }

    // Floating Button Logic
    window.addEventListener('scroll', () => {
        if (window.scrollY > 400) {
            backToTop.style.display = 'flex';
        } else {
            backToTop.style.display = 'none';
        }
    });

    backToTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    initBlog();
</script>
